# Prueba de 250 usuarios concurrentes (primera ronda de pruebas).
# Mismo recorrido que carga-1000.yml: cada usuario entra a la tienda,
# revisa 55 productos (1 s de pausa entre cada uno), agrega uno al
# carrito y finaliza la compra. Los resultados finales del proyecto
# son los de carga-1000.yml.
config:
  target: "http://nginx"
  phases:
    - name: "Rampa hasta 1000 usuarios"
      duration: 10
      arrivalRate: 5
      rampTo: 45
  http:
    timeout: 10

scenarios:
  - name: "Comprador que navega la tienda durante 60 s"
    flow:
      - get:
          url: "/"
      - loop:
          - get:
              url: "/producto/{{ $randomNumber(1, 500) }}"
          - think: 1
        count: 55
      - post:
          url: "/carrito/agregar"
          form:
            producto_id: "{{ $randomNumber(1, 500) }}"
            cantidad: "1"
      - post:
          url: "/checkout"
